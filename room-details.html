<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="685667950_851931460606770_7624076952502804008_n-removebg-preview.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Details - Rental Management System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        .dashboard-header {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 14px 24px;
            background: #fff;
            border-bottom: 1px solid #f0f0f0;
            gap: 16px;
            width: 100vw;
            box-sizing: border-box;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 40;
        }

        .sidebar-dashboard { z-index: 50; }
        .dashboard-content { margin-top: 60px; }

        .notification-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            color: #333;
            padding: 4px;
            display: flex;
            align-items: center;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .user-profile-info {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .user-profile-name { font-size: 13px; font-weight: 600; color: #333; }
        .user-profile-email { font-size: 11px; color: #888; }

        html[data-theme="dark"] body,
        html[data-theme="dark"] .dashboard-body-content {
            background: #111827;
            color: #e5e7eb;
        }

        html[data-theme="dark"] .dashboard-header,
        html[data-theme="dark"] .room-details-container,
        html[data-theme="dark"] .room-item {
            background: #1f2937;
            border-color: #374151;
        }

        html[data-theme="dark"] .dashboard-header {
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        html[data-theme="dark"] .user-profile-name,
        html[data-theme="dark"] .room-header h2,
        html[data-theme="dark"] .room-item-title,
        html[data-theme="dark"] .room-detail-value,
        html[data-theme="dark"] .room-item-meta-label {
            color: #f3f4f6;
        }

        html[data-theme="dark"] .user-profile-email,
        html[data-theme="dark"] .room-counter,
        html[data-theme="dark"] .room-item-address,
        html[data-theme="dark"] .room-detail-label,
        html[data-theme="dark"] .room-item-meta-value,
        html[data-theme="dark"] .room-item-meta-date,
        html[data-theme="dark"] .unit {
            color: #9ca3af;
        }

        html[data-theme="dark"] .room-header,
        html[data-theme="dark"] .room-item-details,
        html[data-theme="dark"] .form-actions {
            border-color: #374151;
        }

        html[data-theme="dark"] .room-item:hover {
            background: #263244;
        }

        html[data-theme="dark"] .room-item:hover .room-item-title {
            color: #f3f4f6;
        }

        html[data-theme="dark"] .room-item.active {
            background: #17405c;
            color: #f3f4f6;
        }

        html[data-theme="dark"] .room-item-price,
        html[data-theme="dark"] .room-detail-icon,
        html[data-theme="dark"] .room-nav-btn {
            color: #5bbfed;
        }

        html[data-theme="dark"] .room-item-meta-row,
        html[data-theme="dark"] .form-column label,
        html[data-theme="dark"] .grid-item label,
        html[data-theme="dark"] .room-image-group label {
            color: #cbd5e1;
        }

        html[data-theme="dark"] .room-form label[style] {
            color: #cbd5e1 !important;
        }

        html[data-theme="dark"] .form-column input {
            color: #f3f4f6;
        }

        html[data-theme="dark"] .form-column input::placeholder,
        html[data-theme="dark"] .grid-item input::placeholder,
        html[data-theme="dark"] .input-group input::placeholder {
            color: #9ca3af;
        }

        html[data-theme="dark"] .grid-item input[type="text"],
        html[data-theme="dark"] .grid-item input[type="number"],
        html[data-theme="dark"] .grid-item input[type="date"],
        html[data-theme="dark"] .select-group select,
        html[data-theme="dark"] .input-group input,
        html[data-theme="dark"] .adjust-btn {
            background: #111827;
            border-color: #4b5563;
            color: #f3f4f6;
            color-scheme: dark;
        }

        html[data-theme="dark"] .form-divider {
            background: #374151;
        }

        html[data-theme="dark"] .input-group input:readonly {
            background: #263244;
        }

        html[data-theme="dark"] .adjust-btn:hover {
            background: #374151;
        }

        html[data-theme="dark"] .room-photo-dropzone {
            background: #111827;
            border-color: #4b5563;
        }

        html[data-theme="dark"] .room-photo-dropzone:hover,
        html[data-theme="dark"] .room-photo-dropzone.drag-over {
            background: #172a3b;
        }

        html[data-theme="dark"] .room-photo-dropzone .drop-text,
        html[data-theme="dark"] .room-photo-dropzone .drop-icon {
            color: #cbd5e1;
        }

        html[data-theme="dark"] .dropdown-menu,
        html[data-theme="dark"] .room-menu-dropdown {
            background: #1f2937;
            border-color: #374151;
        }

        html[data-theme="dark"] .menu-item,
        html[data-theme="dark"] .menu-option {
            color: #e5e7eb;
        }

        html[data-theme="dark"] .menu-item:hover,
        html[data-theme="dark"] .menu-option:hover {
            background: #374151;
        }
    </style>
</head>
<body class="dashboard-body">

<script>
    // Auth guard — runs before anything renders
    (function () {
        const userData = JSON.parse(localStorage.getItem('userData'));
        if (!userData) {
            window.location.href = 'index.html';
        } else if (userData.role === 'tenant') {
            window.location.href = 'dashboard.html';
        }
    })();
</script>

<div class="dashboard-container">

    <!-- Main Content -->
    <main class="dashboard-content">
        <!-- Header -->
        <header class="dashboard-header">
            <div class="user-profile">
                <div id="userAvatar" style="width:32px;height:32px;border-radius:50%;background:#2C96CD;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0;letter-spacing:0.03em;"></div>
                <div class="user-profile-info">
                    <div class="user-profile-name" id="userProfileName">User Name</div>
                    <div class="user-profile-email" id="userProfileEmail">user@email.com</div>
                </div>
            </div>
        </header>

        <!-- Room Details Body -->
        <div class="dashboard-body-content">
            <div class="room-details-wrapper">
                <div class="rooms-list">
                    <div class="rooms-container" id="roomsContainer"></div>
                </div>
                <div class="room-details-container" id="roomDetailsContainer" style="display:none;"></div>
            </div>
            <div class="add-room-container">
                <button class="btn btn-add-room" onclick="openAddRoomForm()">+ Add Room</button>
            </div>
        </div>
    </main>
</div>

<!-- dashboard.js handles: loadUserProfile, navigation, logout, role restrictions -->
<script src="dashboard.js"></script>
<script type="module" src="room-details.js"></script>
<script src="sidebar.js"></script>

</body>
</html>
