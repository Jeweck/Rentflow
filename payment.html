<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous">
<link rel="icon" type="image/png" href="685667950_851931460606770_7624076952502804008_n-removebg-preview.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment and Billing - Rental Management</title>
<link rel="stylesheet" href="styles.css">
<style>
*{box-sizing:border-box}body{margin:0;padding:0}
.dashboard-header{display:flex;align-items:center;justify-content:flex-end;padding:14px 24px;background:#fff;border-bottom:1px solid #f0f0f0;gap:16px;width:100vw;position:fixed;top:0;left:0;right:0;z-index:40}
.sidebar-dashboard{z-index:50}
.main-dashboard{margin-top:60px;min-height:calc(100vh - 60px);background:#f0f2f5}
.user-profile{display:flex;align-items:center;gap:8px}
.user-profile-info{display:flex;flex-direction:column;min-width:0}
.user-profile-name{font-size:13px;font-weight:600;color:#333;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-profile-email{font-size:11px;color:#888;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.pay-body{padding:24px 28px;display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start}
.pay-body.single{grid-template-columns:1fr}
.panel{background:#fff;border:1px solid #e5e7eb;border-radius:12px}
.tenant-panel{overflow:hidden;position:sticky;top:84px}
.panel-head{padding:16px 18px;border-bottom:1px solid #f0f0f0;font-size:15px;font-weight:700;color:#1a1a1a}
html[data-theme="dark"] .panel-head{color:#f3f4f6}
.search{width:calc(100% - 24px);margin:12px;padding:8px 12px;border:1.5px solid #e5e7eb;border-radius:8px;font-size:13px;font-family:inherit;outline:none}
.search:focus{border-color:#2C96CD}
.tenant-list{max-height:calc(100vh - 230px);overflow-y:auto;padding:0 8px 8px}
.tenant-item{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border:none;background:none;border-radius:8px;cursor:pointer;text-align:left;font-family:inherit;transition:background .15s}
.tenant-item:hover{background:#f5f9fc}
.tenant-item.active{background:#e8f5fd}
.avatar{width:36px;height:36px;border-radius:50%;background:#2C96CD;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.tenant-item.active .avatar{background:#1e7aab}
.t-info{flex:1;min-width:0}
.t-name{font-size:13px;font-weight:600;color:#1a1a1a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-sub{font-size:11px;color:#888}
.t-due{background:#fef3c7;color:#d97706;font-size:11px;font-weight:700;border-radius:20px;padding:2px 8px}

.detail-empty{padding:90px 20px;text-align:center;color:#bbb}
.detail-empty i{font-size:46px;margin-bottom:12px;display:block;color:#ccc}
.detail-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 22px;border-bottom:1px solid #f0f0f0;flex-wrap:wrap}
.detail-title{display:flex;align-items:center;gap:12px}
.detail-title h2{margin:0;font-size:18px;color:#1a1a1a}
.detail-title span{font-size:12px;color:#888}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:16px 22px}
.stat{background:#f9fafb;border-radius:10px;padding:12px 14px}
.stat-label{font-size:11px;color:#888;font-weight:600}
.stat-val{font-size:18px;font-weight:700;color:#1a1a1a;margin-top:2px}
.stat-val.paid{color:#16a34a}.stat-val.pending{color:#d97706}
.bills{padding:0 22px 22px;display:flex;flex-direction:column;gap:10px}
.bill{border:1px solid #e5e7eb;border-radius:10px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.bill-left{display:flex;align-items:center;gap:14px;min-width:0;flex:1}
.bill-icon{width:40px;height:40px;border-radius:10px;background:#e8f5fd;color:#2C96CD;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.bill-desc{font-size:14px;font-weight:600;color:#1a1a1a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bill-meta{font-size:12px;color:#888;margin-top:2px}
.bill-right{display:flex;align-items:center;gap:16px;flex-shrink:0}
.bill-amount{font-size:16px;font-weight:700}
.badge{font-size:11px;padding:4px 12px;border-radius:20px;font-weight:600}
.badge-paid{background:#dcfce7;color:#16a34a}.badge-pending{background:#fef3c7;color:#d97706}
.no-bills{text-align:center;padding:50px 20px;color:#bbb;font-size:14px}
.no-bills i{display:block;font-size:38px;margin-bottom:10px}

.action-menu{position:relative}
.menu-btn{background:none;border:1px solid #e8e8e8;cursor:pointer;color:#888;font-size:13px;padding:6px 10px;border-radius:7px}
.menu-btn:hover{background:#f0f8fd;color:#2C96CD;border-color:#2C96CD}
.dropdown-menu{display:none;position:absolute;right:0;top:calc(100% + 4px);background:#fff;border:1px solid #e5e7eb;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.1);z-index:10;min-width:150px;overflow:hidden}
.dropdown-menu.show{display:block}
.menu-item{width:100%;padding:9px 14px;background:none;border:none;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:8px;color:#333;font-family:inherit}
.menu-item:hover{background:#f9fafb}
.menu-item.danger{color:#ef4444}.menu-item.danger:hover{background:#fef2f2}

.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;font-family:inherit;transition:background .15s}
.btn-primary{background:#2C96CD;color:#fff}.btn-primary:hover{background:#1e7aab}
.btn-outline{background:#fff;color:#2C96CD;border:1.5px solid #2C96CD}.btn-outline:hover{background:#f0f7ff}
.btn:disabled{opacity:.6;cursor:not-allowed}
.badge-count{background:#ef4444;color:#fff;border-radius:50%;width:18px;height:18px;font-size:10px;display:inline-flex;align-items:center;justify-content:center}
.header-actions{position:fixed;bottom:32px;right:32px;z-index:50;display:flex;gap:10px}

.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);align-items:center;justify-content:center;z-index:200;padding:16px}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:16px;padding:26px;width:100%;max-width:420px;box-shadow:0 8px 40px rgba(0,0,0,.15);max-height:90vh;overflow-y:auto;position:relative}
.modal.wide{max-width:560px}
.modal h3{font-size:18px;margin:0 0 16px;color:#1a1a1a}
.modal label{font-size:12px;color:#777;display:block;margin:14px 0 5px;font-weight:600}
.modal input,.modal select,.modal textarea{width:100%;padding:9px 12px;border:1.5px solid #e5e7eb;border-radius:8px;font-size:14px;font-family:inherit;outline:none}
.modal input:focus,.modal select:focus,.modal textarea:focus{border-color:#2C96CD}
.modal-actions{display:flex;gap:10px;margin-top:22px}
.modal-actions .btn{flex:1;justify-content:center;padding:10px}
.btn-cancel{background:#f3f4f6;color:#555}.btn-cancel:hover{background:#e5e7eb}
.close-x{position:absolute;top:14px;right:16px;background:none;border:none;font-size:24px;cursor:pointer;color:#999}
.sub-card{border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;margin-bottom:12px}
.sub-card img{width:100%;max-height:200px;object-fit:cover;display:block;cursor:zoom-in}
.sub-info{padding:12px 16px;background:#fafafa;font-size:12px;color:#666}
.sub-info b{display:block;font-size:13px;color:#1a1a1a}
.link-danger{background:none;border:none;color:#ef4444;font-size:11px;cursor:pointer;padding:0;margin-top:6px}
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);align-items:center;justify-content:center;z-index:400;cursor:zoom-out}
.lightbox.open{display:flex}
.lightbox img{max-width:90vw;max-height:90vh;border-radius:8px}
.pm-btn{width:100%;padding:13px;margin-bottom:10px;border:2px solid #e5e7eb;background:#fff;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;display:flex;align-items:center;gap:10px;font-family:inherit}
.pm-btn.active{border-color:#2C96CD;background:#2C96CD;color:#fff}
.pm-details{display:none;background:#f9fafb;padding:14px;border-radius:8px;margin-top:12px}
.pm-details.show{display:block}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #e5e7eb;font-size:13px}
.row:last-of-type{border-bottom:none}.row span:first-child{color:#888;font-weight:600}
.drop{border:2px dashed #c8d8e8;border-radius:12px;padding:28px 16px;text-align:center;color:#999;font-size:13px;position:relative;background:#fafcff}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.loading{display:flex;justify-content:center;gap:10px;padding:50px;color:#aaa;font-size:14px}
.toast{position:fixed;bottom:90px;right:32px;background:#333;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:500;opacity:0;transform:translateY(10px);transition:all .3s;pointer-events:none}
.toast.show{opacity:1;transform:none}.toast.success{background:#16a34a}.toast.error{background:#ef4444}
.badge-partial{background:#e0f2fe;color:#0369a1}.badge-rej{background:#fee2e2;color:#dc2626}
.sub-actions{display:flex;gap:8px;margin-top:10px}
.btn-ok{background:#16a34a;color:#fff}.btn-ok:hover{background:#15803d}
.btn-no{background:#fff;color:#ef4444;border:1.5px solid #ef4444}.btn-no:hover{background:#fef2f2}
@media(max-width:860px){.pay-body{grid-template-columns:1fr;padding:16px 16px 90px}.tenant-panel{position:static}.tenant-list{max-height:240px}.summary{grid-template-columns:1fr}.bill{flex-wrap:wrap}}
</style>
</head>
<body>
<div class="dashboard-container">
  <header class="dashboard-header">
    <div class="user-profile">
      <div id="userAvatar" class="avatar" style="width:32px;height:32px"></div>
      <div class="user-profile-info">
        <div class="user-profile-name" id="userProfileName">User Name</div>
        <div class="user-profile-email" id="userProfileEmail"></div>
      </div>
    </div>
  </header>

  <div class="main-dashboard">
    <div class="pay-body" id="payBody">
      <aside class="panel tenant-panel" id="tenantPanel">
        <div class="panel-head">Tenants</div>
        <input class="search" id="tenantSearch" placeholder="Search tenants…">
        <div class="tenant-list" id="tenantList"><div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading…</div></div>
      </aside>
      <section class="panel" id="detailPanel"></section>
    </div>
  </div>
  <div class="header-actions" id="actions"></div>
</div>

<!-- Add/Edit billing -->
<div class="overlay" id="billModal"><div class="modal">
  <h3 id="billTitle">Add billing</h3>
  <p id="billTenant" style="margin:0;font-size:13px;color:#888"></p>
  <label>Description</label><input id="bDesc" placeholder="e.g. Monthly rent - June">
  <label>Amount (₱)</label><input type="number" id="bAmount" placeholder="e.g. 5000">
  <label>Due date</label><input type="date" id="bDue">
  <label>Status</label>
  <select id="bStatus"><option value="pending">Pending</option><option value="paid">Paid</option></select>
  <div class="modal-actions"><button class="btn btn-cancel" id="bCancel">Cancel</button><button class="btn btn-primary" id="bSave">Save billing</button></div>
</div></div>

<!-- Upload receipt (tenant) -->
<div class="overlay" id="uploadModal"><div class="modal">
  <h3><i class="fas fa-cloud-upload-alt" style="color:#2C96CD"></i> Upload receipt</h3>
  <div class="drop" id="drop"><input type="file" id="file" accept="image/*"><span id="dropText"><b style="color:#2C96CD">Click or drag</b> an image here</span></div>
  <label>Pay toward</label><select id="uBill"></select>
  <label>Amount paid (₱)</label><input type="number" id="uAmount" placeholder="e.g. 5000">
  <label>Your name</label><input id="uName">
  <label>Note (optional)</label><textarea id="uNote" rows="2" placeholder="e.g. Rent for June"></textarea>
  <div class="modal-actions"><button class="btn btn-cancel" id="uCancel">Cancel</button><button class="btn btn-primary" id="uSubmit">Submit receipt</button></div>
</div></div>

<!-- Submitted receipts (landlord) -->
<div class="overlay" id="viewModal"><div class="modal wide">
  <button class="close-x" id="viewClose">&times;</button>
  <h3><i class="fas fa-images" style="color:#2C96CD"></i> Submitted receipts</h3>
  <div id="subList"></div>
</div></div>

<div class="lightbox" id="lightbox"><img id="lightboxImg" alt="Full receipt"></div>

<!-- Pay now (tenant) -->
<div class="overlay" id="payModal"><div class="modal">
  <button class="close-x" id="payClose">&times;</button>
  <h3 style="text-align:center">Payment methods</h3>
  <button class="pm-btn active" data-m="gcash"><i class="fas fa-mobile-alt"></i> GCash</button>
  <button class="pm-btn" data-m="bank"><i class="fas fa-university"></i> Bank Transfer</button>
  <div class="pm-details show" id="pm-gcash">
    <div class="row"><span>Landlord name</span><span>Maria Santos</span></div>
    <div class="row"><span>GCash number</span><span id="gcashNum">09171234567</span></div>
    <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:10px" data-copy="gcashNum">Copy number</button>
  </div>
  <div class="pm-details" id="pm-bank">
    <div class="row"><span>Landlord name</span><span>Maria Santos</span></div>
    <div class="row"><span>Bank</span><span>BPI</span></div>
    <div class="row"><span>Account number</span><span id="bankNum">1234567890</span></div>
    <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:10px" data-copy="bankNum">Copy account number</button>
  </div>
</div></div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const CLOUD='dvxwsj8j2', PRESET='Rentflow_Reciepts';
firebase.initializeApp({
  apiKey:"AIzaSyAGd7Aaiu_d-VIokG16gapCZOlpGheb9tY",
  authDomain:"rentalmangemnetsystem.firebaseapp.com",
  projectId:"rentalmangemnetsystem",
  storageBucket:"rentalmangemnetsystem.firebasestorage.app",
  messagingSenderId:"143952534193",
  appId:"1:143952534193:web:1a0dc97e5e0f10fde16090"
});
const db=firebase.firestore();
const tenantsCol=db.collection('tenants'), billsCol=db.collection('receipts'), subsCol=db.collection('submittedReceipts');

let role='landlord', me={}, tenants=[], tenantDirectory=[], bills=[], selectedId=null, editingId=null, upFile=null, mySubs=[], subs=[], tenantIdentityMatched=true;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').trim().replace(/\s+/g,' ').toLowerCase();
const tenantNameKey=t=>norm(tName(t)).replace(/\s+/g,'');
const peso=n=>'₱'+(parseFloat(n)||0).toLocaleString('en-PH',{minimumFractionDigits:2});
const initials=n=>{const p=String(n||'?').trim().split(/\s+/);return ((p[0]||'?')[0]+(p.length>1?p[p.length-1][0]:'')).toUpperCase()};
const tName=t=>String([t.firstName,t.lastName].filter(Boolean).join(' ').trim()||t.name||t.fullName||t.tenantName||'Unnamed tenant');
function toast(m,t=''){const e=$('toast');e.textContent=m;e.className='toast show '+t;setTimeout(()=>e.className='toast',3200)}

const sameTenantName=(a,b)=>tenantNameKey(a)===tenantNameKey(b);
const uniqueTenantName=(tenant,directory=tenantDirectory)=>directory.filter(t=>sameTenantName(t,tenant)).length===1;
const belongsToTenant=(record,tenant,directory=tenantDirectory)=>{
  if(record.tenantId)return record.tenantId===tenant.id;
  return uniqueTenantName(tenant,directory)&&tenantNameKey({name:record.name})===tenantNameKey(tenant);
};
const billsFor=t=>bills.filter(b=>belongsToTenant(b,t));
const unpaid=b=>String(b.status||'').toLowerCase()!=='paid'&&Math.max(0,(parseFloat(b.amount)||0)-paidOf(b))>0.005;
const dueCount=t=>billsFor(t).filter(unpaid).length;
const selected=()=>tenants.find(t=>t.id===selectedId);

const paidOf=b=>String(b.status||'').toLowerCase()==='paid'?(parseFloat(b.amount)||0):(parseFloat(b.paidAmount)||0);
const badgeHtml=b=>String(b.status||'').toLowerCase()==='paid'?'<span class="badge badge-paid">Paid</span>':paidOf(b)>0?'<span class="badge badge-partial">Partial</span>':'<span class="badge badge-pending">Pending</span>';
const subBadge=s=>({accepted:'<span class="badge badge-paid">Accepted</span>',rejected:'<span class="badge badge-rej">Rejected</span>'}[s.status]||'<span class="badge badge-pending">Awaiting review</span>');
function mySubsHtml(){
  if(!mySubs.length)return '';
  return '<div style="padding:0 22px 22px"><div style="font-size:13px;font-weight:700;margin-bottom:8px">Your submitted receipts</div><div class="bills" style="padding:0">'+mySubs.map(x=>`<div class="bill"><div class="bill-left"><div class="bill-icon"><i class="fas fa-image"></i></div><div style="min-width:0"><div class="bill-desc">${x.amount?peso(x.amount):'Receipt'}</div><div class="bill-meta">${esc(x.date||'')}${x.status==='rejected'&&x.reason?' · Reason: '+esc(x.reason):''}</div></div></div>${subBadge(x)}</div>`).join('')+'</div></div>';
}

function renderTenants(){
  const q=norm($('tenantSearch').value);
  const rows=tenants.filter(t=>norm([tName(t),t.room,t.roomNumber,t.email].filter(Boolean).join(' ')).includes(q));
  $('tenantList').innerHTML=rows.length?rows.map(t=>{
    const d=dueCount(t);
    return `<button class="tenant-item ${t.id===selectedId?'active':''}" data-id="${esc(t.id)}">
      <div class="avatar">${esc(initials(tName(t)))}</div>
      <div class="t-info"><div class="t-name">${esc(tName(t))}</div><div class="t-sub">${(t.room||t.roomNumber)?'Room '+esc(t.room||t.roomNumber):billsFor(t).length+' billing(s)'}</div></div>
      ${d?`<span class="t-due">${d} due</span>`:''}</button>`}).join('')
    :'<div class="no-bills" style="padding:30px 10px">No tenants found.</div>';
}

function renderDetail(){
  const t=selected(), p=$('detailPanel');
  if(!t){p.innerHTML='<div class="detail-empty"><i class="fas fa-user-check"></i>Select a tenant to see their billing.</div>';return}
  const list=billsFor(t).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
  const total=list.reduce((s,b)=>s+(parseFloat(b.amount)||0),0);
  const paid=list.reduce((s,b)=>s+paidOf(b),0);
  const isL=role!=='tenant';
  p.innerHTML=`
    <div class="detail-head">
      <div class="detail-title"><div class="avatar">${esc(initials(tName(t)))}</div>
        <div><h2>${esc(tName(t))}</h2><span>${(t.room||t.roomNumber)?'Room '+esc(t.room||t.roomNumber)+' · ':''}${list.length} billing${list.length!==1?'s':''}</span></div></div>
      ${isL?'<button class="btn btn-primary" id="addBillBtn"><i class="fas fa-plus"></i> Add billing</button>':''}
    </div>
    <div class="summary">
      <div class="stat"><div class="stat-label">Total billed</div><div class="stat-val">${peso(total)}</div></div>
      <div class="stat"><div class="stat-label">Paid</div><div class="stat-val paid">${peso(paid)}</div></div>
      <div class="stat"><div class="stat-label">Balance due</div><div class="stat-val pending">${peso(total-paid)}</div></div>
    </div>
    <div class="bills">${list.length?list.map(b=>`
      <div class="bill" data-id="${esc(b.id)}">
        <div class="bill-left"><div class="bill-icon"><i class="fas fa-file-invoice"></i></div>
          <div style="min-width:0"><div class="bill-desc">${esc(b.description||'Billing')}</div>
          <div class="bill-meta">${b.dueDate?'Due '+esc(b.dueDate):'Added '+esc(b.date||'—')}${String(b.status||'').toLowerCase()!=='paid'&&paidOf(b)>0?' · '+peso(paidOf(b))+' paid':''}</div></div></div>
        <div class="bill-right">
          ${badgeHtml(b)}
          <div class="bill-amount">${peso(b.amount)}</div>
          ${isL?`<div class="action-menu"><button class="menu-btn" data-act="menu"><i class="fas fa-ellipsis-v"></i></button>
            <div class="dropdown-menu">
              <button class="menu-item" data-act="toggle"><i class="fas fa-check-circle"></i> Mark as ${String(b.status||'').toLowerCase()==='paid'?'pending':'paid'}</button>
              <button class="menu-item" data-act="edit"><i class="fas fa-edit"></i> Edit</button>
              <button class="menu-item danger" data-act="delete"><i class="fas fa-trash"></i> Delete</button>
            </div></div>`:''}
        </div></div>`).join(''):
      `<div class="no-bills"><i class="fas fa-receipt"></i>No billing for this tenant yet.${isL?' Use <b>Add billing</b> to create one.':''}</div>`}
    </div>${role==='tenant'?mySubsHtml():''}`;
}

function select(id){selectedId=id;renderTenants();renderDetail()}

async function findTenantForUser(){
  const requestedId=me.tenantId||me.uid;
  if(requestedId){
    try{
      const snap=await tenantsCol.doc(requestedId).get();
      if(snap.exists)return {id:snap.id,...snap.data()};
    }catch(error){console.warn('Could not look up tenant profile by ID:',error)}
  }
  const email=norm(me.email);
  if(email){
    try{
      const snap=await tenantsCol.where('email','==',email).limit(2).get();
      if(snap.size===1)return {id:snap.docs[0].id,...snap.docs[0].data()};
    }catch(error){console.warn('Could not look up tenant profile by email:',error)}
  }
  const name=norm(me.name||me.username);
  if(name){
    try{
      const snap=await tenantsCol.where('name','==',me.name||me.username).limit(2).get();
      if(snap.size===1)return {id:snap.docs[0].id,...snap.docs[0].data()};
    }catch(error){console.warn('Could not look up tenant profile by name:',error)}
    const firstName=String(me.name||me.username).trim().split(/\s+/)[0];
    if(firstName){
      try{
        const snap=await tenantsCol.where('firstName','==',firstName).limit(25).get();
        const matches=snap.docs.map(d=>({id:d.id,...d.data()})).filter(t=>norm(tName(t))===name);
        if(matches.length===1)return matches[0];
      }catch(error){console.warn('Could not look up legacy tenant profile:',error)}
    }
  }
  return null;
}

async function load(){
  try{
    if(role==='tenant'){
      const [tenant,bs]=await Promise.all([findTenantForUser(),billsCol.get()]);
      bills=bs.docs.map(d=>({id:d.id,...d.data()}));
      tenantIdentityMatched=Boolean(tenant);
      tenants=[tenant||{id:me.tenantId||me.uid||'me',name:me.name||me.username||'Me',room:me.room,legacy:true}];
      tenantDirectory=tenants;
      bills=bills.filter(b=>belongsToTenant(b,tenants[0]));
      selectedId=tenants[0].id;
      const ss=await subsCol.get();
      mySubs=ss.docs.map(d=>({id:d.id,...d.data()}))
        .filter(x=>belongsToTenant(x,tenants[0]))
        .sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
      $('uName').value=tName(tenants[0]);
    }else{
      const [ts,bs]=await Promise.all([tenantsCol.get(),billsCol.get()]);
      bills=bs.docs.map(d=>({id:d.id,...d.data()}));
      tenantDirectory=ts.docs.map(d=>({id:d.id,...d.data()}));
      tenants=[...tenantDirectory].sort((a,b)=>tName(a).localeCompare(tName(b)));
      // Receipts for people not in the tenants list still show up
      const known=new Set(tenants.map(tenantNameKey));
      bills.forEach(b=>{
        if(!b.tenantId&&b.name&&!known.has(tenantNameKey({name:b.name}))){
          known.add(tenantNameKey({name:b.name}));
          tenants.push({id:'legacy:'+norm(b.name),name:b.name,legacy:true});
        }
      });
      tenantDirectory=tenants;
    }
    renderTenants();
    renderDetail();
    if(role==='tenant'&&!tenantIdentityMatched){
      toast('Tenant profile not linked. Ask your landlord to add your account email on the Tenants page.','error');
    }
  }catch(e){
    console.error('Payment page load error:',e);
    $('tenantList').innerHTML='<div class="no-bills">Could not load tenants or billing. Check your connection and refresh.</div>';
    toast('Failed to load payment data: '+e.message,'error');
  }
}

// ── Billing add/edit ──
function openBill(b){
  const t=selected();if(!t)return;
  editingId=b?b.id:null;
  $('billTitle').textContent=b?'Edit billing':'Add billing';
  $('billTenant').textContent='Tenant: '+tName(t);
  $('bDesc').value=b?.description||'';$('bAmount').value=b?.amount||'';
  $('bDue').value=b?.dueDate||'';$('bStatus').value=String(b?.status||'pending').toLowerCase();
  $('billModal').classList.add('open');
}
$('bCancel').onclick=()=>$('billModal').classList.remove('open');
$('bSave').onclick=async()=>{
  const t=selected(),desc=$('bDesc').value.trim(),amount=$('bAmount').value.trim();
  const numericAmount=Number(amount);
  if(!t){toast('Select a tenant first.','error');return}
  if(!desc||!Number.isFinite(numericAmount)||numericAmount<=0){toast('Enter a description and a valid amount greater than zero.','error');return}
  const data={tenantId:t.legacy?'':t.id,name:tName(t),description:desc,amount:numericAmount,dueDate:$('bDue').value,status:$('bStatus').value};
  const old=bills.find(b=>b.id===editingId);
  data.paidAmount=data.status==='paid'?numericAmount:Math.min(numericAmount,old&&String(old.status||'').toLowerCase()!=='paid'?(parseFloat(old.paidAmount)||0):0);
  const btn=$('bSave');btn.disabled=true;btn.textContent='Saving…';
  try{
    if(editingId){await billsCol.doc(editingId).update(data);Object.assign(bills.find(b=>b.id===editingId),data);toast('Billing updated.','success')}
    else{
      data.date=new Date().toLocaleDateString('en-PH',{month:'short',day:'numeric',year:'numeric'});
      data.createdAt=firebase.firestore.FieldValue.serverTimestamp();
      const r=await billsCol.add(data);bills.push({id:r.id,...data,createdAt:{seconds:Date.now()/1000}});toast('Billing added.','success');
    }
    $('billModal').classList.remove('open');renderTenants();renderDetail();
  }catch(e){toast('Failed to save billing.','error')}
  finally{btn.disabled=false;btn.textContent='Save billing'}
};

// ── Clicks ──
$('tenantList').addEventListener('click',e=>{const b=e.target.closest('.tenant-item');if(b)select(b.dataset.id)});
$('tenantSearch').addEventListener('input',renderTenants);
$('detailPanel').addEventListener('click',async e=>{
  if(e.target.closest('#addBillBtn')){openBill();return}
  const btn=e.target.closest('[data-act]');if(!btn)return;
  const row=btn.closest('.bill'),b=bills.find(x=>x.id===row.dataset.id),act=btn.dataset.act;
  if(act==='menu'){
    e.stopPropagation();const m=btn.nextElementSibling;
    document.querySelectorAll('.dropdown-menu').forEach(x=>{if(x!==m)x.classList.remove('show')});
    m.classList.toggle('show');return;
  }
  document.querySelectorAll('.dropdown-menu').forEach(x=>x.classList.remove('show'));
  if(act==='edit')openBill(b);
  if(act==='toggle'){
    const s=String(b.status||'').toLowerCase()==='paid'?'pending':'paid';
    try{const pa=s==='paid'?(parseFloat(b.amount)||0):0;await billsCol.doc(b.id).update({status:s,paidAmount:pa});b.status=s;b.paidAmount=pa;renderTenants();renderDetail();toast('Marked as '+s+'.','success')}
    catch(_){toast('Failed to update.','error')}
  }
  if(act==='delete'){
    if(!confirm(`Delete "${b.description||'this billing'}"?`))return;
    try{await billsCol.doc(b.id).delete();bills=bills.filter(x=>x.id!==b.id);renderTenants();renderDetail();toast('Billing deleted.','success')}
    catch(_){toast('Failed to delete.','error')}
  }
});
document.addEventListener('click',e=>{if(!e.target.closest('.action-menu'))document.querySelectorAll('.dropdown-menu').forEach(m=>m.classList.remove('show'))});
document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('open')}));

// ── Tenant: upload receipt ──
function uploadToCloudinary(file){
  return new Promise((res,rej)=>{
    const fd=new FormData();fd.append('file',file);fd.append('upload_preset',PRESET);fd.append('folder','rental_receipts');
    const x=new XMLHttpRequest();x.open('POST',`https://api.cloudinary.com/v1_1/${CLOUD}/image/upload`);
    x.onload=()=>x.status===200?res(JSON.parse(x.responseText).secure_url):rej(new Error('Cloudinary error '+x.status));
    x.onerror=()=>rej(new Error('Network error.'));x.send(fd);
  });
}
$('file').onchange=e=>{upFile=e.target.files[0]||null;$('dropText').textContent=upFile?upFile.name:'Click or drag an image here'};
$('uCancel').onclick=()=>$('uploadModal').classList.remove('open');
$('uSubmit').onclick=async()=>{
  const tenant=tenants[0],name=tenant?tName(tenant):'';
  if(!upFile){toast('Select an image.','error');return}
  if(!upFile.type.startsWith('image/')){toast('Select an image file.','error');return}
  if(upFile.size>10*1024*1024){toast('Receipt images must be 10 MB or smaller.','error');return}
  if(!tenant){toast('Your tenant profile is still loading. Try again shortly.','error');return}
  if(!name){toast('Enter your name.','error');return}
  const amt=Number($('uAmount').value);
  if(!Number.isFinite(amt)||amt<=0){toast('Enter a valid amount greater than zero.','error');return}
  const billId=$('uBill').value;
  const tenantBills=billsFor(tenant).filter(unpaid);
  if(billId&&!tenantBills.some(b=>b.id===billId)){toast('That billing is not assigned to your account.','error');return}
  const balance=tenantBills.reduce((sum,b)=>sum+Math.max(0,(parseFloat(b.amount)||0)-paidOf(b)),0);
  if(balance<=0){toast('There is no unpaid billing linked to your tenant account.','error');return}
  if(balance>0&&amt>balance+0.005){toast('The amount cannot exceed your remaining balance of '+peso(balance)+'.','error');return}
  const btn=$('uSubmit');btn.disabled=true;btn.textContent='Uploading…';
  try{
    const imageUrl=await uploadToCloudinary(upFile);
    const submission={
      name,tenantId:tenant.legacy?'':tenant.id,tenantEmail:tenant.email||me.email||'',
      billId,amount:amt,status:'pending',note:$('uNote').value.trim()||'(no note)',imageUrl,
      date:new Date().toLocaleDateString('en-PH',{month:'short',day:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'}),
      createdAt:firebase.firestore.FieldValue.serverTimestamp()
    };
    const ref=await subsCol.add(submission);
    mySubs.unshift({id:ref.id,...submission,date:'Just now'});renderDetail();$('uAmount').value='';
    upFile=null;$('file').value='';$('dropText').textContent='Click or drag an image here';$('uNote').value='';
    $('uploadModal').classList.remove('open');toast('Receipt submitted to landlord.','success');
  }catch(err){toast('Upload failed: '+err.message,'error')}
  finally{btn.disabled=false;btn.textContent='Submit receipt'}
};

// ── Landlord: review submitted receipts ──
async function openSubmitted(){
  const el=$('subList');el.innerHTML='<div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading…</div>';
  $('viewModal').classList.add('open');
  try{
    const r=await subsCol.get();
    subs=r.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
    renderSubs();
  }catch(error){console.error('Submitted receipts load error:',error);el.innerHTML='<div class="no-bills">Failed to load submitted receipts.</div>';toast('Failed to load submitted receipts: '+error.message,'error')}
}
function renderSubs(){
  const el=$('subList');
  if(!subs.length){el.innerHTML='<div class="no-bills"><i class="fas fa-inbox"></i>No submitted receipts yet.</div>';return}
  el.innerHTML=subs.map(x=>{
    const st=x.status||'pending',bill=x.billId&&bills.find(b=>b.id===x.billId);
    const tenant=x.tenantId?tenantDirectory.find(t=>t.id===x.tenantId):tenantDirectory.find(t=>belongsToTenant(x,t));
    return `<div class="sub-card">${x.imageUrl?`<img src="${esc(x.imageUrl)}" alt="Receipt">`:'<div class="no-bills">Receipt image unavailable.</div>'}
      <div class="sub-info"><b>${esc(tenant?tName(tenant):x.name||'Unmatched tenant')}${x.amount?' · '+peso(x.amount):''}</b>
      ${bill?`<div>For: ${esc(bill.description||'Billing')}</div>`:''}<div>${esc(x.note||'')}</div>
      <div style="color:#aaa;margin-top:3px">${esc(x.date)}</div>
      ${st==='pending'?`<div class="sub-actions"><button class="btn btn-ok" data-accept="${esc(x.id)}"><i class="fas fa-check"></i> Accept and deduct</button><button class="btn btn-no" data-reject="${esc(x.id)}"><i class="fas fa-times"></i> Reject</button></div>`
      :`<div style="margin-top:8px">${subBadge(x)}${x.reason?' <span>Reason: '+esc(x.reason)+'</span>':''}</div><button class="link-danger" data-dismiss="${x.id}">✕ Remove from list</button>`}
      </div></div>`}).join('');
}
async function acceptSub(id){
  const s=subs.find(x=>x.id===id);
  if(!s||String(s.status||'pending').toLowerCase()!=='pending'){toast('This receipt has already been reviewed.','error');return}
  let amt=Number(s.amount);
  if(!(Number.isFinite(amt)&&amt>0)){amt=Number(prompt('Amount paid (₱)?'));if(!(Number.isFinite(amt)&&amt>0))return}
  const tenant=s.tenantId
    ?tenantDirectory.find(t=>t.id===s.tenantId)
    :tenantDirectory.find(t=>belongsToTenant(s,t));
  if(!tenant){toast('Cannot match this receipt to a unique tenant. No billing was changed.','error');return}
  const pool=billsFor(tenant).filter(unpaid).sort((a,b)=>{
    if(a.id===s.billId)return -1;
    if(b.id===s.billId)return 1;
    const aDue=a.dueDate?Date.parse(a.dueDate):Infinity;
    const bDue=b.dueDate?Date.parse(b.dueDate):Infinity;
    if(aDue!==bDue)return aDue-bDue;
    return (a.createdAt?.seconds||0)-(b.createdAt?.seconds||0);
  });
  if(s.billId&&!pool.some(b=>b.id===s.billId)&&!bills.some(b=>b.id===s.billId&&belongsToTenant(b,tenant))){
    toast('The selected billing does not belong to this tenant. No billing was changed.','error');return
  }
  if(!pool.length){toast('This tenant has no unpaid billing.','error');return}
  try{
    const remaining=await db.runTransaction(async transaction=>{
      const submissionRef=subsCol.doc(id);
      const submissionSnap=await transaction.get(submissionRef);
      if(!submissionSnap.exists||String(submissionSnap.data().status||'pending').toLowerCase()!=='pending'){
        throw new Error('This receipt has already been reviewed.');
      }
      const submissionData=submissionSnap.data();
      if(submissionData.tenantId
        ?submissionData.tenantId!==tenant.id
        :!belongsToTenant(submissionData,tenant)){
        throw new Error('This receipt is not linked to the selected tenant.');
      }
      if(submissionData.billId!==s.billId)throw new Error('The receipt target billing changed. Reload and try again.');
      const storedAmount=Number(submissionData.amount);
      const approvedAmount=Number.isFinite(storedAmount)&&storedAmount>0?storedAmount:amt;
      const billSnaps=[];
      for(const bill of pool)billSnaps.push(await transaction.get(billsCol.doc(bill.id)));
      let left=approvedAmount;
      const changes=[];
      billSnaps.forEach((snap,index)=>{
        if(!snap.exists||left<=0.005)return;
        const data=snap.data();
        if(!belongsToTenant({...data,id:snap.id},tenant)||!unpaid(data))return;
        const total=parseFloat(data.amount)||0;
        const previouslyPaid=String(data.status||'').toLowerCase()==='paid'?total:(parseFloat(data.paidAmount)||0);
        const applied=Math.min(Math.max(0,total-previouslyPaid),left);
        if(applied<=0.005)return;
        const paidAmount=previouslyPaid+applied;
        const status=paidAmount>=total-0.005?'paid':'pending';
        left-=applied;
        changes.push({id:snap.id,paidAmount,status});
      });
      if(!changes.length)throw new Error('No unpaid billing remains for this tenant.');
      changes.forEach(change=>transaction.update(billsCol.doc(change.id),{paidAmount:change.paidAmount,status:change.status}));
      transaction.update(submissionRef,{status:'accepted',amount:approvedAmount,reviewedAt:firebase.firestore.FieldValue.serverTimestamp()});
      return {left,changes,amount:approvedAmount};
    });
    remaining.changes.forEach(change=>{
      const bill=bills.find(x=>x.id===change.id);
      if(bill){bill.paidAmount=change.paidAmount;bill.status=change.status}
    });
    s.status='accepted';s.amount=remaining.amount;
    toast(remaining.left>0.005?'Accepted for this tenant. '+peso(remaining.left)+' could not be applied because the tenant has no remaining balance.':'Accepted and deducted from this tenant’s billing.','success');
    renderTenants();renderDetail();renderSubs();updateSubCount();
  }catch(error){console.error('Receipt approval failed:',error);toast('Failed to apply receipt: '+error.message,'error')}
}
async function rejectSub(id){
  const reason=prompt('Reason for rejecting (optional):');if(reason===null)return;
  try{
    await subsCol.doc(id).update({status:'rejected',reason:reason.trim(),reviewedAt:firebase.firestore.FieldValue.serverTimestamp()});
    const s=subs.find(x=>x.id===id);s.status='rejected';s.reason=reason.trim();
    toast('Receipt rejected.','success');renderSubs();updateSubCount();
  }catch(error){console.error('Receipt rejection failed:',error);toast('Failed to reject receipt: '+error.message,'error')}
}
$('subList').addEventListener('click',async e=>{
  if(e.target.tagName==='IMG'){$('lightboxImg').src=e.target.src;$('lightbox').classList.add('open');return}
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.accept){t.disabled=true;try{await acceptSub(t.dataset.accept)}finally{if(t.isConnected)t.disabled=false}return}
  if(t.dataset.reject){rejectSub(t.dataset.reject);return}
  if(t.dataset.dismiss){
    try{await subsCol.doc(t.dataset.dismiss).delete();subs=subs.filter(x=>x.id!==t.dataset.dismiss);renderSubs();updateSubCount()}
    catch(error){console.error('Submitted receipt removal failed:',error);toast('Failed to remove receipt: '+error.message,'error')}
  }
});
$('viewClose').onclick=()=>$('viewModal').classList.remove('open');
$('lightbox').onclick=()=>$('lightbox').classList.remove('open');

async function updateSubCount(){
  if(role==='tenant')return;
  let n=0;try{n=(await subsCol.get()).docs.filter(d=>(d.data().status||'pending')==='pending').length}catch(_){}
  $('actions').innerHTML=`<button class="btn btn-primary" id="viewSubBtn"><i class="fas fa-images"></i> View submitted ${n?`<span class="badge-count">${n}</span>`:''}</button>`;
  $('viewSubBtn').onclick=openSubmitted;
}

  if(!u){location.replace('index.html');return}
  me=u;role=u.role||'landlord';
  $('userProfileName').textContent=u.username||u.name||'User';
  $('userProfileEmail').textContent=u.email||'';
  $('userAvatar').textContent=initials(u.name||u.username||u.email||'U');

    $('payBody').classList.add('single');$('tenantPanel').style.display='none';$('uName').value=u.name||'';
    $('uName').readOnly=true;
    $('actions').innerHTML=`<button class="btn btn-outline" id="upBtn" style="background:#fff"><i class="fas fa-upload"></i> Upload receipt</button>
      <button class="btn btn-primary" id="payBtn"><i class="fas fa-building"></i> Pay now</button>`;
    $('upBtn').onclick=()=>{
      const t=tenants[0];
      if(!t){toast('Your tenant profile is still loading. Try again shortly.','error');return}
      const open=billsFor(t).filter(unpaid).sort((a,b)=>{
        const aDue=a.dueDate?Date.parse(a.dueDate):Infinity;
        const bDue=b.dueDate?Date.parse(b.dueDate):Infinity;
        return aDue-bDue||(a.createdAt?.seconds||0)-(b.createdAt?.seconds||0);
      });
      $('uBill').innerHTML='<option value="">Apply to oldest unpaid billing first</option>'+open.map(b=>`<option value="${esc(b.id)}">${esc(b.description||'Billing')} (${peso(Math.max(0,(parseFloat(b.amount)||0)-paidOf(b)))} left)</option>`).join('');
      $('uBill').value=open[0]?.id||'';
      $('uAmount').value='';
      $('uNote').value='';
      upFile=null;$('file').value='';$('dropText').innerHTML='<b style="color:#2C96CD">Click or drag</b> an image here';
      $('uploadModal').classList.add('open');
    };
    $('payBtn').onclick=()=>$('payModal').classList.add('open');
  }else updateSubCount();
  renderDetail();load();
});
