<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Available rooms - RentFlow</title>
<link rel="icon" type="image/png" href="685667950_851931460606770_7624076952502804008_n-removebg-preview.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{
  --navy:#0b1440; --deep:#0d2a2b; --sea:#0e2d42;
  --cyan:#4fc3ec; --lime:#a6d04f; --ice:#f2ffd6;
  --ink:#10203a; --muted:#5d6b82; --paper:#fbfdf7;
  --serif:'Fraunces',Georgia,serif; --sans:'Manrope',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%;background:var(--navy)}
body{
  font-family:var(--sans);color:var(--paper);
  background:
    radial-gradient(ellipse 80% 50% at 50% 0%,rgba(140,192,99,.28),transparent 70%),
    linear-gradient(180deg,var(--deep) 0%,var(--sea) 50%,var(--navy) 100%) fixed;
}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}

.top{display:flex;align-items:center;justify-content:space-between;padding:20px clamp(16px,4vw,48px)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:22px;font-weight:600}
.brand img{height:38px;width:auto}
.ghost{background:rgba(255,255,255,.08);color:var(--paper);border:1px solid rgba(255,255,255,.22);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;transition:background .2s}
.ghost:hover{background:rgba(255,255,255,.16)}

.wrap{padding:8px clamp(16px,4vw,48px) 48px;max-width:1280px;margin:0 auto}

/* Showcase: photo is the hero, details card overlaps its edge */
.showcase{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:center}
.media{position:relative;aspect-ratio:4/3.1;border-radius:32px;overflow:hidden;background:#12304a;box-shadow:0 30px 70px rgba(0,0,0,.45)}
.media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.media.swap img,.media.swap .ph{animation:photoIn .6s cubic-bezier(.2,.7,.2,1) both}
@keyframes photoIn{from{opacity:0;transform:scale(1.05)}to{opacity:1;transform:none}}
.ph{position:absolute;inset:0;display:grid;place-items:center;font-size:56px;color:rgba(255,255,255,.25);background:linear-gradient(135deg,#17405c,#0f2a44)}
.media::after{content:"";position:absolute;inset:auto 0 0 0;height:35%;background:linear-gradient(transparent,rgba(5,12,40,.65));pointer-events:none;z-index:1}
.badge{position:absolute;top:18px;left:18px;z-index:3;background:var(--lime);color:#17300a;font-weight:700;font-size:13px;padding:7px 14px;border-radius:999px}
.ctrl{position:absolute;left:18px;bottom:18px;z-index:30;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:999px;background:rgba(11,20,64,.72);border:1px solid rgba(255,255,255,.38);box-shadow:0 10px 18px rgba(0,0,0,.24);backdrop-filter:blur(8px)}
.ctrl button{width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.55);background:#0b1440;color:#fff;display:grid;place-items:center;box-shadow:0 6px 14px rgba(0,0,0,.15);transition:background .2s,transform .2s}
.ctrl button:hover{background:#12255d;transform:scale(1.08)}
.ctrl button i{font-size:16px;line-height:1}
.ctrl .count{font-weight:700;font-size:15px;min-width:56px;padding:8px 10px;border-radius:999px;background:rgba(255,255,255,.08);color:#fff;text-align:center;text-shadow:0 1px 8px rgba(0,0,0,.5);display:inline-flex;align-items:center;justify-content:center}

.info{position:relative;z-index:3;margin-left:-72px;background:var(--paper);color:var(--ink);border-radius:28px;padding:clamp(22px,3vw,40px);box-shadow:0 24px 60px rgba(0,0,0,.35)}
.info.swap{animation:infoIn .5s .08s ease both}
@keyframes infoIn{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.info .kicker{color:var(--muted);font-weight:600;font-size:14px;margin-bottom:6px}
.info h1{font-family:var(--serif);font-weight:600;font-size:clamp(26px,3.2vw,40px);line-height:1.12;margin-bottom:14px;overflow-wrap:anywhere}
.price{font-family:var(--serif);font-size:clamp(30px,3.6vw,46px);font-weight:600;color:var(--navy);line-height:1}
.price small{font-family:var(--sans);font-size:15px;font-weight:600;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}
.chips span{display:inline-flex;align-items:center;gap:7px;background:#eaf6fb;color:#12506c;border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600}
.desc{color:#34435c;line-height:1.65;font-size:15px;max-width:60ch;margin-bottom:18px}
dl{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;font-size:14px;padding-top:16px;border-top:1px solid #dfe7ee;margin-bottom:24px}
dt{color:var(--muted)} dd{font-weight:600;overflow-wrap:anywhere}
.actions{display:flex;flex-wrap:wrap;gap:12px}
.btn{border:0;border-radius:14px;padding:15px 26px;font-weight:700;font-size:15px;transition:transform .2s,box-shadow .2s,background .2s}
.btn-book{background:var(--navy);color:#fff;flex:1 1 170px;box-shadow:0 10px 24px rgba(11,20,64,.3)}
.btn-book:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(11,20,64,.4)}
.btn-skip{background:transparent;color:var(--navy);border:2px solid #cfdbe6;flex:1 1 170px}
.btn-skip:hover{background:#eef4f8}

.btn-browse{flex:1 1 100%;background:#eaf6fb;color:#12506c}
.btn-browse:hover{background:#d9eef7}
.btn-browse i{margin-right:8px}

#picker{border:0;border-radius:24px;padding:0;width:min(520px,calc(100vw - 24px));max-height:80vh;background:var(--paper);color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.5);overflow:hidden}
#picker[open]{animation:infoIn .3s ease both}
#picker::backdrop{background:rgba(5,12,40,.65);backdrop-filter:blur(4px)}
.pk-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid #dfe7ee}
.pk-head h2{font-family:var(--serif);font-size:22px}
.pk-close{width:38px;height:38px;border-radius:50%;border:0;background:#eef4f8;color:var(--navy)}
#pkList{list-style:none;padding:10px;margin:0;overflow-y:auto;max-height:calc(80vh - 76px)}
#pkList button{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:none;border:2px solid transparent;border-radius:16px;padding:10px;color:inherit;transition:background .2s}
#pkList button:hover{background:#eef6fa}
#pkList button[aria-current="true"]{border-color:var(--cyan);background:#eaf6fb}
.pk-thumb{width:84px;height:64px;border-radius:12px;background:#17405c center/cover;flex-shrink:0;display:grid;place-items:center;color:rgba(255,255,255,.4)}
.pk-text{min-width:0;display:flex;flex-direction:column;gap:2px}
.pk-text strong{font-size:15px}
.pk-text span{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk-text em{font-style:normal;font-weight:700;color:var(--navy);font-size:14px}

.state{text-align:center;padding:90px 20px;max-width:520px;margin:0 auto}
.state h2{font-family:var(--serif);font-size:30px;margin:14px 0 8px}
.state p{color:rgba(255,255,255,.75);line-height:1.6;margin-bottom:22px}
.state .spin{font-size:34px;color:var(--cyan)}
.state .btn-book{background:var(--lime);color:#17300a;box-shadow:none}
[hidden]{display:none!important}

@media (max-width:900px){
  .showcase{grid-template-columns:1fr}
  .media{aspect-ratio:4/3;border-radius:26px}
  .info{margin:-48px 12px 0}
}
@media (max-width:480px){
  .brand span{display:none}
  .info{margin:-36px 6px 0;border-radius:22px}
  .media{border-radius:22px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <img src="ERROR_404_Rental_Management-main/logoRent.png" alt="" onerror="this.style.display='none'">
    <span>RentFlow</span>
  </div>
  <button class="ghost" id="skipTop" type="button">Skip to sign in</button>
</header>

<main class="wrap">
  <section class="state" id="state" aria-live="polite">
    <i class="fas fa-spinner fa-spin spin"></i>
    <h2>Finding available rooms</h2>
  </section>

  <section class="showcase" id="showcase" hidden aria-label="Available rooms">
    <div class="media" id="media">
      <img id="photo" alt="" hidden>
      <div class="ph" id="ph"><i class="fas fa-image"></i></div>
      <span class="badge">Available now</span>
      <div class="ctrl" id="ctrl">
        <button type="button" id="prev" aria-label="Previous room"><i class="fas fa-chevron-left"></i></button>
        <span class="count" id="count" aria-live="polite"></span>
        <button type="button" id="next" aria-label="Next room"><i class="fas fa-chevron-right"></i></button>
      </div>
    </div>
    <article class="info" id="info"></article>
  </section>
</main>

<dialog id="picker" aria-labelledby="pkTitle">
  <div class="pk-head">
    <h2 id="pkTitle">Browse other units</h2>
    <button type="button" class="pk-close" id="pkClose" aria-label="Close"><i class="fas fa-xmark"></i></button>
  </div>
  <ul id="pkList"></ul>
</dialog>

<script type="module" src="room-ads.js"></script>
</body>
</html>
